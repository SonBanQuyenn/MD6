# Chế độ KHỞI ĐẦU: chưa có chứng chỉ TLS → phục vụ HTTP để certbot xác minh tên miền.
# Sau khi có chứng chỉ, khởi động lại Nginx sẽ tự chuyển sang https.conf.
# DNS nội bộ của Docker — dùng cho "resolve" trong upstream (IP container có thể đổi)
resolver 127.0.0.11 valid=10s ipv6=off;
include /etc/nginx/upstream/active.conf;

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/templates/common.inc;
}
