# Chế độ PRODUCTION: có chứng chỉ Let's Encrypt cho ${DOMAIN}.
include /etc/nginx/upstream/active.conf;

# HTTP → chỉ phục vụ xác minh certbot (gia hạn), còn lại chuyển hướng sang HTTPS (NFR-SEC-01)
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Trình duyệt chỉ dùng HTTPS cho tên miền này trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/templates/common.inc;
}
