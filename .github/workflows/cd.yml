# CD: build image (tag = commit SHA) → đẩy lên Amazon ECR → deploy blue/green lên EC2 qua SSM.
#
# CHƯA BẬT cho tới khi hạ tầng AWS được tạo (Phase 13). Bật bằng GitHub repo Variables:
#   DEPLOY_ENABLED=true, AWS_REGION, AWS_DEPLOY_ROLE_ARN, DOMAIN
# Không có khoá AWS dài hạn nào ở đây (NFR-SEC-03): GitHub OIDC → AssumeRole → credentials tạm thời
# (hết hạn sau ~1 giờ). Role chỉ được: đẩy image vào 2 repo ECR + gửi lệnh SSM tới EC2 gắn tag App=shopfast.
name: CD

on:
  # Tự động sau khi CI trên main xanh
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Chạy tay: deploy lại một commit, hoặc quay lui
  workflow_dispatch:
    inputs:
      action:
        description: deploy | rollback
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read
  id-token: write # cho phép xin OIDC token để AssumeRole trên AWS

# Không bao giờ chạy 2 lần deploy song song
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-push:
    name: build & push images
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build & push API (tag = commit SHA, không dùng "latest")
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/shopfast-api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/shopfast-web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy (blue/green) on EC2
    needs: build-push
    runs-on: ubuntu-latest
    environment: production # có thể bật "Required reviewers" để phải duyệt trước khi deploy
    steps:
      - uses: actions/checkout@v4 # lấy script .github/scripts/ssm-run.sh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # deploy.sh tự quay lui nếu bản mới không qua health check (trước hoặc sau khi chuyển traffic)
      - name: Run deploy.sh on EC2 via SSM
        run: ./.github/scripts/ssm-run.sh "./infra/deploy/remote-deploy.sh deploy ${{ env.SHA }}"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

  verify:
    name: post-deploy health check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: GET https://DOMAIN/api/health (qua Internet, HTTPS)
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "https://${{ vars.DOMAIN }}/api/health"; then exit 0; fi
            sleep 6
          done
          echo "::error::Health check qua Internet thất bại — chạy workflow này với action=rollback"
          exit 1

  # Health check qua Internet hỏng SAU khi deploy báo thành công → tự quay lui về bản trước
  auto-rollback:
    name: auto rollback
    needs: verify
    if: failure() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./.github/scripts/ssm-run.sh "./infra/deploy/remote-deploy.sh rollback"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}

  rollback:
    name: rollback on EC2 (manual)
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./.github/scripts/ssm-run.sh "./infra/deploy/remote-deploy.sh rollback"
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
